name: pb_controller
description: "A new Flutter project."
publish_to: "none"
version: 2.0.8+20

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  flutter_blue_plus: ^2.0.2
  shared_preferences: ^2.5.3
  permission_handler: ^11.3.1
  flutter_riverpod: ^3.0.3
  dio: ^5.9.0
  freezed_annotation: ^3.1.0
  json_annotation: ^4.9.0
  device_info_plus: ^12.2.0
  package_info_plus: ^8.0.2
  cupertino_icons: ^1.0.8
  flutter_launcher_icons: ^0.14.4
  url_launcher: ^6.3.2
  vibration: ^3.1.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_native_splash: ^2.4.7

  build_runner: ^2.10.4
  freezed: ^3.1.0
  json_serializable: ^6.7.0

flutter:
  uses-material-design: true
  assets:
    - assets/icons/
    - assets/icons/Home/
    - assets/icons/HomeUnified/
    - assets/icons/Gamepad_Mode_Edit/
    - assets/icons/Gamepad_4Buttons/
    - assets/icons/Joystick/
    - assets/Logo/
    - assets/icons/botton/
  fonts:
    - family: THSarabunNew
      fonts:
        - asset: assets/fonts/THSarabunNew/THSarabunNew.ttf
        - asset: assets/fonts/THSarabunNew/THSarabunNew Bold.ttf
          weight: 700
        - asset: assets/fonts/THSarabunNew/THSarabunNew Italic.ttf
          style: italic
        - asset: assets/fonts/THSarabunNew/THSarabunNew BoldItalic.ttf
          weight: 700
          style: italic
    - family: Roboto
      fonts:
        - asset: assets/fonts/Roboto/static/Roboto-Regular.ttf
        - asset: assets/fonts/Roboto/static/Roboto-Bold.ttf
          weight: 700
        - asset: assets/fonts/Roboto/static/Roboto-Italic.ttf
          style: italic
        - asset: assets/fonts/Roboto/static/Roboto-BoldItalic.ttf
          weight: 700
          style: italic
    - family: Kanit
      fonts:
        - asset: assets/fonts/Kanit/Kanit-Regular.ttf
        - asset: assets/fonts/Kanit/Kanit-Bold.ttf
          weight: 700
        - asset: assets/fonts/Kanit/Kanit-Italic.ttf
          style: italic
        - asset: assets/fonts/Kanit/Kanit-BoldItalic.ttf
          weight: 700
          style: italic

flutter_native_splash:
  android: true
  ios: true
  color: "#050910"
  color_dark: "#050910"
  image: assets/Logo/Splash_Screen.png
  image_dark: assets/Logo/Splash_Screen.png

  android_12:
    color: "#050910"
    color_dark: "#050910"
    image: assets/Logo/Splash_Screen.png
    image_dark: assets/Logo/Splash_Screen.png


flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/Logo/App_Icon.png"
  adaptive_icon_foreground: "assets/Logo/App_Icon.png"
  adaptive_icon_background: "#121212"
